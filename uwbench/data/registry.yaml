trashcan:
  name: TrashCan
  full_name: TrashCan 1.0
  task: instance segmentation / detection (marine debris)
  survey_ref: "[222]"
  citation: "J. Hong, M. Fulton, J. Sattar, TrashCan 1.0: An instance-segmentation labeled dataset of trash observations, Data Repository for U of M, 2020, doi:10.13020/g1gx-y834"
  homepage: https://hdl.handle.net/11299/214865
  license_page: https://hdl.handle.net/11299/214865
  license: >-
    "Free for academic teaching/research use, must obtain JAMSTEC permission for
    commercial use. See LICENSE.txt for further information" (DataCite rights field).
  license_status: TODO(verify)
  access: manual
  sources: [https://api.datacite.org/dois/10.13020/g1gx-y834]
  checked: 2026-11-15
  notes: >-
    7,212 images, two versions (TrashCan-Material and TrashCan-Instance) according to the
    DataCite description. The repository page sits behind a bot check, so it cannot be
    fetched automatically. The archive itself contains no LICENSE.txt (README files only).
    Official train/val splits (COCO JSON): instance version 6065 / 1147, material version
    6008 / 1204; original_data/ holds 7212 images with per-image Supervisely JSON.
  manual_instructions: >-
    Open https://hdl.handle.net/11299/214865 in a browser, read LICENSE.txt, download the
    dataset archive (images and labels, not the checkpoints), save it as
    datasets/trashcan/archives/TrashCan.zip, then run
    "uwbench download trashcan --accept-license", which checks the SHA-256 and extracts it.
  files:
    - {name: TrashCan.zip, sha256: caf93d992b85343cfc500386c94ca9ffa6c63e2284e04127753a40db8f33ba4c}
  expected:
    - {subset: instance_train, path: TrashCan/dataset/instance_version/train, count: 6065}
    - {subset: instance_val, path: TrashCan/dataset/instance_version/val, count: 1147}
    - {subset: material_train, path: TrashCan/dataset/material_version/train, count: 6008}
    - {subset: material_val, path: TrashCan/dataset/material_version/val, count: 1204}
    - {subset: original_images, path: TrashCan/dataset/original_data/images, count: 7212}
    - {subset: original_annotations, path: TrashCan/dataset/original_data/annotations, count: 7212}
  published: 2020-07  # survey ref [222], arXiv:2007.08097, July 2020
  # Instance version; annotations are in instances_{train,val}_trashcan.json (COCO).
  # The official train/val split is NOT used: 113 of the 115 source videos of its val set
  # also appear in its train set (frame names vid_<video>_frame<k>). The benchmark splits
  # TrashCan by video instead (configs/splits.yaml, split_unit). The folder of each image
  # (train/ or val/) tells which official COCO JSON holds its annotations.
  samples:
    - {roles: {image: TrashCan/dataset/instance_version/train}}
    - {roles: {image: TrashCan/dataset/instance_version/val}}

