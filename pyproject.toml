[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uwbench"
version = "1.0.0"
description = "UWBench: reference evaluation protocol for underwater semantic communications (acoustic and optical)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",  # np.bitwise_count for Hamming distances
    "scipy>=1.10",
    "torch>=2.1",
    "pyyaml>=6.0",
    "gdown>=5.1",
    "pillow>=10.0",
    "imagehash>=4.3",
    "torchvision>=0.16",  # AlexNet backbone of LPIPS
    "pytorch-msssim>=1.0",
    "lpips>=0.1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
# 5G NR LDPC of the separation baseline (uwbench/baselines/channel_coding.py)
baseline = ["sionna-no-rt>=2.2"]

[project.scripts]
uwbench = "uwbench.cli:main"

[tool.setuptools.packages.find]
include = ["uwbench*"]

[tool.setuptools.package-data]
uwbench = ["data/registry.yaml", "data/manifests/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
