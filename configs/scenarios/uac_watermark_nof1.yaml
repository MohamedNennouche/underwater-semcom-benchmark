# Measured acoustic channel: replay of the Watermark NOF1 archive (Oslofjord, 10-18 kHz,
# 60 files x 33 s; uwbench/channels/watermark.py). OFDM sampled at fs_tau = 16 kHz with
# 1024 subcarriers in the 8 kHz band (7.8 Hz spacing, 128 ms symbols, the shortest
# allowed by the 2048-tap recorded delay window) and a 2048-sample (128 ms) cyclic
# prefix covering that whole window (99 % of the energy lies within 77-91 ms).
# Measured with perfect (diagonal) CSI, 16 x 8192 symbols: NMSE -9.2 dB noiseless and
# -11.6 dB at 25 dB SNR, an inter-carrier interference floor due to the time variation
# of NOF1 (snapshot correlation 0.89 at 128 ms). Requires the Watermark archive.
# TODO(verify): numerology is a benchmark choice to be confirmed by the maintainers.
name: uac_watermark_nof1
channel: watermark_ofdm
params:
  channel: NOF1
  n_subcarriers: 1024
  cp_length: 2048
snr_db: {start: -5, stop: 25, step: 5}
