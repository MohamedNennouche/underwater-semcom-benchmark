# Optical IM/DD link (uwbench/channels/uwoc.py). Attenuation c from Table III of the
# survey (configs/uwoc_water.yaml). SNR = transmit electrical SNR; received SNR =
# SNR * h^2 (Beer-Lambert loss alone: 26.1 dB).
# TODO(verify): distance, aperture, beam radius and jitter are benchmark choices to be confirmed by the maintainers.
name: uwoc_pointing
channel: uwoc
params:
  water_type: clear_ocean
  distance_m: 20
  pointing: {aperture_radius_m: 0.05, beam_radius_m: 0.2, jitter_std_m: 0.05}
snr_db: {start: -5, stop: 50, step: 5}
