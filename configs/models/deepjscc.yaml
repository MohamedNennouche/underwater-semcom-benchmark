# Bourtsoulatze et al., TCCN 2019 [55]; optimiser settings of
# https://github.com/chunbaobao/Deep-JSCC-PyTorch (inspiration): Adam, lr 1e-3, weight decay
# 5e-4, learning rate halved on plateau (patience 5 here, 15 there: our early stop is at 20).
# Learned system for uwbench train / uwbench evaluate (PROTOCOL.md section 7).
# TODO(verify): bandwidth ratio (1/6 or 1/12). Batch sizes
# fit a 24 GB GPU (RTX 3090); lower them on smaller GPUs.
name: deepjscc
type: learned
model: uwbench.models.deepjscc:DeepJSCC
params: {bandwidth_ratio: 0.1666667}
checkpoint: checkpoints/deepjscc_{scenario}/best.pt
modulation_index: 1.0  # optical channel: DC bias 1, s = max(0, 1 + m f / rms(f))
train:
  datasets: [lsui, euvp, uieb]
  crop: 128
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 5.0e-4
  scheduler: {type: plateau, factor: 0.5, patience: 5, min_lr: 1.0e-6}  # several halvings before the early stop
  epochs: 200           # safety cap; training normally stops on convergence
  early_stop_patience: 20  # stop after 20 epochs without a better validation PSNR
  workers: 6            # data-loading processes
  val_images: 512        # fixed validation subset
  seed: 0
