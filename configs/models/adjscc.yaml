# Xu et al., TCSVT 2022 [253]: port of the MIT code
# Learned system for uwbench train / uwbench evaluate (PROTOCOL.md section 7).
# TODO(verify): bandwidth ratio (1/6 or 1/12) and epochs (GPU budget). Batch sizes
# fit a 24 GB GPU (RTX 3090); lower them on smaller GPUs.
name: adjscc
type: learned
model: uwbench.models.adjscc:ADJSCC
params: {bandwidth_ratio: 0.1666667}
checkpoint: checkpoints/adjscc_{scenario}/best.pt
modulation_index: 1.0  # optical channel: DC bias 1, s = max(0, 1 + m f / rms(f))
train:
  datasets: [lsui, euvp, uieb]
  crop: 128
  batch_size: 16
  lr: 1.0e-4
  epochs: 100
  workers: 6            # data-loading processes
  val_images: 512        # fixed validation subset
  seed: 0
